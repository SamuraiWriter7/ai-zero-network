name: Validate AI Zero Network v0.1

on:
  push:
    paths:
      - "schemas/**"
      - "examples/v0.1/**"
      - "scripts/validate.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"

  pull_request:
    paths:
      - "schemas/**"
      - "examples/v0.1/**"
      - "scripts/validate.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas and examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate AI Zero Network v0.1
        run: |
          python scripts/validate.py
